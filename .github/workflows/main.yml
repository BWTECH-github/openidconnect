name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: openidconnect
  PHP_VERSION: '8.4'

jobs:
  lint-and-style:
    name: Lint and code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'vendor-bin/owncloud-codestyle/composer.json') }}
          restore-keys: |
            composer-${{ env.PHP_VERSION }}-

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: php -l (syntax check)
        run: |
          set -e
          find appinfo lib templates tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Install codestyle bin
        run: composer bin owncloud-codestyle install --no-progress --no-interaction --prefer-dist

      - name: Run php-cs-fixer (dry-run)
        run: |
          php -d zend.enable_gc=0 vendor-bin/owncloud-codestyle/vendor/bin/php-cs-fixer \
            fix -v --diff --allow-risky=yes --dry-run

  integration:
    name: Integration smoke (clone owncloud.online core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owncloud.online core
        uses: actions/checkout@v4
        with:
          repository: BWTECH-github/owncloud.online
          ref: main
          path: server

      - name: Checkout ${{ env.APP_NAME }} into apps/
        uses: actions/checkout@v4
        with:
          path: server/apps/${{ env.APP_NAME }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: gd, intl, mbstring, xml, zip, sqlite3, pdo_sqlite, curl, openssl
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-integration-${{ env.PHP_VERSION }}-${{ hashFiles('server/composer.lock', 'server/apps/${{ env.APP_NAME }}/composer.lock') }}
          restore-keys: |
            composer-integration-${{ env.PHP_VERSION }}-

      - name: Install core Composer dependencies
        working-directory: server
        run: |
          if [ -f composer.json ]; then
            composer install --no-progress --no-interaction --prefer-dist --no-dev || true
          fi

      - name: Install app Composer dependencies
        working-directory: server/apps/${{ env.APP_NAME }}
        run: composer install --no-progress --no-interaction --prefer-dist --no-dev

      - name: Install owncloud.online (sqlite)
        working-directory: server
        run: |
          mkdir -p data
          php occ maintenance:install \
            --database sqlite \
            --admin-user admin \
            --admin-pass admin

      - name: Enable ${{ env.APP_NAME }}
        working-directory: server
        run: php occ app:enable ${{ env.APP_NAME }}

      - name: Verify app is enabled
        working-directory: server
        run: |
          php occ app:list | tee app-list.txt
          grep -E "^\s*-\s*${APP_NAME}:" app-list.txt
